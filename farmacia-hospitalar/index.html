<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia Hospitalar - Acesso ao Sistema</title>
    <!-- Tailwind CSS via CDN, igual ao protótipo aprovado -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <div class="flex-grow flex items-center justify-center px-4 py-12 bg-gradient-to-br from-teal-800 via-teal-950 to-slate-900">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-2xl border border-slate-100">
            <div class="text-center">
                <div class="inline-block bg-teal-600 p-4 rounded-2xl text-white mb-3 shadow-md shadow-teal-600/20">
                    <i class="fa-solid fa-heart-pulse text-4xl"></i>
                </div>
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Farmácia Hospitalar</h2>
                <p class="mt-2 text-sm text-slate-500">Gerenciamento de Requisições e Estoque</p>
            </div>

            <!-- Mensagem de erro: exibida via JS quando o controller redireciona com ?erro=1 -->
            <div id="mensagem-erro" class="hidden bg-red-50 border border-red-100 text-red-700 text-sm font-medium px-4 py-3 rounded-lg text-center">
                Usuário ou senha inválidos.
            </div>

            <form id="form-login" class="mt-8 space-y-6" action="controllers/login_controller.php" method="POST" novalidate>
                <div class="space-y-4">
                    <div>
                        <label for="login" class="block text-xs font-bold uppercase text-slate-500 tracking-wider mb-2">E-mail ou Usuário</label>
                        <div class="relative">
                            <i class="fa-solid fa-user-nurse absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input id="login" name="login" type="text" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm font-medium" placeholder="seuemail@exemplo.com">
                        </div>
                        <small class="erro-campo hidden text-red-600 text-xs mt-1 block"></small>
                    </div>
                    <div>
                        <label for="senha" class="block text-xs font-bold uppercase text-slate-500 tracking-wider mb-2">Senha de Acesso</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input id="senha" name="senha" type="password" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm font-medium" placeholder="••••••••">
                        </div>
                        <small class="erro-campo hidden text-red-600 text-xs mt-1 block"></small>
                    </div>
                </div>

                <div>
                    <button type="submit" id="btn-entrar" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-150 shadow-md">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fa-solid fa-right-to-bracket text-teal-200 group-hover:text-white transition"></i>
                        </span>
                        Acessar Sistema
                    </button>
                </div>
            </form>

            <p class="text-center text-xs text-slate-400">Sistema interno &middot; Acesso restrito</p>
        </div>
    </div>

    <script src="assets/js/validacao.js"></script>
    <script>
        // Lê ?erro=1 (enviado pelo login_controller.php quando a autenticação falha)
        const params = new URLSearchParams(window.location.search);
        if (params.get('erro') === '1') {
            document.getElementById('mensagem-erro').classList.remove('hidden');
        }
    </script>

</body>
</html>
